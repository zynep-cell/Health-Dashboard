<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kişisel Sağlık Risk Değerlendirme</title>
    <style>
        /* Genel Sayfa Stilleri */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f9fafb;
            color: #374151;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 24px;
        }

        h2 {
            text-align: left;
            margin-bottom: 20px;
            color: #1f2937;
            border-bottom: 1px solid #e5e7eb;
            padding-bottom: 10px;
        }

        /* Düzen (Grid Sistemi) */
        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
        }

        .column {
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Form Elemanları */
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9em;
            color: #4b5563;
        }

        input[type="number"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1em;
        }

        /* Slider */
        .slider-container {
            width: 100%;
        }
        input[type="range"] {
            width: 100%;
        }
        .slider-val {
            font-size: 0.8em;
            text-align: right;
            color: #6b7280;
        }

        /* Radio Buttons */
        .radio-group {
            display: flex;
            gap: 15px;
        }
        .radio-group label {
            font-weight: normal;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        /* Buton Grubu */
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        /* Genel Buton Stili */
        button {
            border: none;
            padding: 12px 20px;
            font-size: 1.1em;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
            flex: 1; /* Butonları eşit genişliğe yay */
        }

        /* Hesapla Butonu */
        .btn-calc {
            background-color: #f97316;
            color: white;
        }
        .btn-calc:hover {
            background-color: #ea580c;
        }

        /* Temizle Butonu */
        .btn-clear {
            background-color: #9ca3af; /* Gri ton */
            color: white;
        }
        .btn-clear:hover {
            background-color: #6b7280;
        }

        /* Tablo Stilleri */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            font-size: 0.95em;
        }
        th, td {
            border: 1px solid #e5e7eb;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #f3f4f6;
            font-weight: 700;
        }

        /* Feedback Box */
        .feedback-box {
            background-color: #fff8e1;
            border: 1px solid #ffe082;
            padding: 20px;
            border-radius: 8px;
            line-height: 1.6;
            font-size: 1rem;
            min-height: 150px;
        }
        
        .feedback-item {
            margin-bottom: 10px;
        }

        .feedback-title {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: #d35400;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .row {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Kişisel Sağlık Risk Değerlendirme ve Farkındalık Kartı</h2>

    <div class="row">
        <div class="column">
            <form id="healthForm" onsubmit="return false;">
                <div>
                    <label for="gender">Cinsiyet</label>
                    <select id="gender">
                        <option value="" disabled selected>Seçiniz</option>
                        <option value="Erkek">Erkek</option>
                        <option value="Kadın">Kadın</option>
                    </select>
                </div>

                <div>
                    <label for="age">Yaş</label>
                    <input type="number" id="age" placeholder="Örn: 30">
                </div>

                <div>
                    <label for="boy">Boy (m) - Örn: 1.75</label>
                    <input type="number" id="boy" step="0.01" placeholder="Örn: 1.75">
                </div>

                <div>
                    <label for="kilo">Kilo (kg)</label>
                    <input type="number" id="kilo" placeholder="Örn: 70">
                </div>

                <div class="slider-container">
                    <label for="stress">Stres Seviyesi (0-10)</label>
                    <input type="range" id="stress" min="0" max="10" step="1" value="5" oninput="document.getElementById('stress-val').innerText = this.value">
                    <div class="slider-val">Değer: <span id="stress-val">5</span></div>
                </div>

                <div>
                    <label for="activity">Fiziksel Aktivite (dakika)</label>
                    <input type="number" id="activity" placeholder="Örn: 30">
                </div>

                <div>
                    <label for="sleep">Uyku Süresi (saat)</label>
                    <input type="number" id="sleep" placeholder="Örn: 7">
                </div>

                <div>
                    <label>Sigara İçiyor mu?</label>
                    <div class="radio-group">
                        <label><input type="radio" name="sigara" value="Evet"> Evet</label>
                        <label><input type="radio" name="sigara" value="Hayır"> Hayır</label>
                    </div>
                </div>

                <div>
                    <label for="su">Günlük Su Tüketimi (mL)</label>
                    <input type="number" id="su" placeholder="Örn: 2000">
                </div>

                <div>
                    <label for="bagirsak">Bağırsak Alışkanlığı</label>
                    <select id="bagirsak">
                        <option value="" disabled selected>Seçiniz</option>
                        <option value="Düzenli">Düzenli</option>
                        <option value="Kabız">Kabız</option>
                        <option value="İshal">İshal</option>
                        <option value="Düzensiz">Düzensiz</option>
                    </select>
                </div>

                <div>
                    <label for="systolic">Sistolik Kan Basıncı (Büyük Tansiyon)</label>
                    <input type="number" id="systolic" placeholder="Örn: 120">
                </div>

                <div>
                    <label for="diastolic">Diyastolik Kan Basıncı (Küçük Tansiyon)</label>
                    <input type="number" id="diastolic" placeholder="Örn: 80">
                </div>

                <div class="btn-group">
                    <button class="btn-calc" onclick="calculateRisk()">Hesapla</button>
                    <button class="btn-clear" onclick="clearForm()">Temizle</button>
                </div>
            </form>
        </div>

        <div class="column">
            <div>
                <table id="resultTable">
                    <thead>
                        <tr>
                            <th>Kategori</th>
                            <th>Durum</th>
                            <th>Emoji</th>
                        </tr>
                    </thead>
                    <tbody>
                        </tbody>
                </table>
            </div>

            <div class="feedback-box">
                <div class="feedback-title">💡 Farkındalık Kartı ve Kritik Mesajlar</div>
                <div id="farkindalik_text">
                    Sonuçları görmek için bilgilerinizi girip "Hesapla" butonuna basınız.
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // ----------------------
    // Yardımcı Fonksiyonlar
    // ----------------------

    function bmi_category(bmi) {
        if (bmi < 18.5) {
            return ["Zayıf", "⚠️", "#FFBABA"];
        } else if (bmi >= 18.5 && bmi < 25) {
            return ["Normal", "✔️", "#BAFFC9"];
        } else if (bmi >= 25 && bmi < 30) {
            return ["Fazla Kilolu", "⚠️", "#FFD700"];
        } else {
            return ["Obez", "⚠️", "#FF6B6B"];
        }
    }

    function bp_category(systolic, diastolic) {
        if (systolic <= 120 && diastolic <= 80) {
            return ["Normal", "✔️", "#BAFFC9"];
        } else if ((systolic > 120 && systolic < 130) && diastolic < 90) {
            return ["Normal-Yüksek", "⚠️", "#FFD700"];
        } else if ((systolic >= 130 && systolic < 140) || (diastolic > 80 && diastolic < 90)) {
            return ["Prehipertansiyon", "⚠️", "#FFD700"];
        } else {
            return ["Hipertansiyon", "⚠️", "#FF6B6B"];
        }
    }

    function risk_score_calculator(bmi_cat, bp_cat, stress, activity, sleep, sigara, su, bagirsak) {
        let score = 0;
        if (["Zayıf", "Fazla Kilolu"].includes(bmi_cat)) {
            score += 1;
        } else if (bmi_cat === "Obez") {
            score += 2;
        }

        if (["Prehipertansiyon", "Hipertansiyon"].includes(bp_cat)) {
            score += 1;
        }
        if (stress >= 7) {
            score += 1;
        }
        if (activity < 30) {
            score += 1;
        }
        if (sleep < 7) {
            score += 1;
        }
        score += sigara;
        if (su < 2000) {
            score += 1;
        }
        if (["Kabız", "İshal"].includes(bagirsak)) {
            score += 1;
        } else if (bagirsak === "Düzensiz") {
            score += 2;
        }
        return score;
    }

    function risk_label(score) {
        if (score <= 2) {
            return ["Düşük", "✔️", "#BAFFC9", 0];
        } else if (score >= 3 && score <= 5) {
            return ["Orta", "⚠️", "#FFD700", 1];
        } else {
            return ["Yüksek", "⚠️", "#FF6B6B", 1];
        }
    }

    // Başlıklar eklenmiş Farkındalık Mesajı Fonksiyonu
    function farkindalik_mesaji(bmi, bp_cat, stres, aktivite, uyku, sigara, su, bagirsak, risk_flag) {
        let mesajlar = [];

        function ekle(baslik, mesaj) {
            mesajlar.push(`<div class="feedback-item"><strong>${baslik}:</strong> ${mesaj}</div>`);
        }

        // BMI
        if (bmi === "Zayıf") {
            ekle("Kilo Durumu", "Kilonuz ideal seviyenin altında görünüyor; yeterli ve dengeli beslenmeye özen göstererek günlük kalori ve protein alımınızı artırmanız önerilir. 🥑");
        } else if (bmi === "Fazla Kilolu") {
            ekle("Kilo Durumu", "Porsiyon kontrolü ve düzenli egzersiz ile kilo yönetimi önerilir. 🥗🚶‍♀️");
        } else if (bmi === "Obez") {
            ekle("Kilo Durumu", "Kilonuz ideal seviyenin üzerindedir; obezitenin kalp-damar sağlığını etkileyebileceğini düşünerek beslenmenize ve günlük hareketliliğinize özen göstermeniz önerilir. 🥗🏃‍♂️");
        } else {
            ekle("Kilo Durumu", "Vücut kitle indeksiniz ideal aralıkta — yeterli ve dengeli beslenmeye devam etmeniz önerilir. ✅");
        }

        // KAN BASINCI
        if (bp_cat === "Normal") {
            ekle("Kan Basıncı", "Normal düzeydedir — düzenli ölçüm ve sağlıklı yaşam alışkanlıklarına devam edin. ❤️");
        } else if (bp_cat === "Elevated" || bp_cat === "Normal-Yüksek") {
            ekle("Kan Basıncı", "Yükselme eğilimindedir; tuz tüketimini azaltmanız ve aktiviteyi artırmanız önerilir. 🧂");
        } else if (bp_cat === "Prehipertansiyon") {
            ekle("Kan Basıncı", "Prehipertansiyon düzeyindesiniz; kilo kontrolü, tuz kısıtlaması ve egzersiz önemlidir. 🚶‍♂️");
        } else {
            ekle("Kan Basıncı", "Hipertansiyon riski mevcuttur; düzenli tansiyon takibi ve profesyonel sağlık desteği önerilir. ⚠️");
        }

        // STRES
        if (stres >= 5) {
            ekle("Stres Yönetimi", "Yüksek stres seviyeleri kardiyovasküler riski artırabilir; gevşeme egzersizleri önerilir. 🧘‍♂️");
        } else {
            ekle("Stres Yönetimi", "Stres seviyeniz dengededir — ruhsal iyilik halinizi koruyun. 🌿");
        }

        // AKTİVİTE
        if (aktivite < 30) {
            ekle("Fiziksel Aktivite", "Aktivite düzeyinizi artırmak için haftada en az 3 gün, 30 dakika süreyle düzenli egzersiz yapmanız önerilir. 🚶‍♀️");
        } else {
            ekle("Fiziksel Aktivite", "Aktivite düzeyiniz ideal görünüyor; bu düzeni sürdürün ve egzersizlerinizi ihmal etmeyin. 💪");
        }

        // UYKU
        if (uyku < 7) {
            ekle("Uyku Düzeni", "Yetersiz uyku bağışıklık sistemini zayıflatabilir; uyku sürenize ve uyku alışkanlıklarınıza özen gösterin. 🛌");
        } else {
            ekle("Uyku Düzeni", "Uyku süreniz ideal aralıkta — bunu korumak için her gün aynı saatte yatıp kalkmaya ve uyumadan en az 30 dakika önce ekran kullanımını azaltmaya özen gösterin. 🌙");
        }

        // SİGARA
        if (sigara === 1) {
            ekle("Tütün Kullanımı", "Sigara, kalp-damar sağlığınızı ve akciğerlerinizi olumsuz etkiler; bırakma sürecinizi destekleyecek programlardan yararlanmanız önerilir. 🚭");
        } else {
            ekle("Tütün Kullanımı", "Sigara kullanmamak önemli bir koruyucu sağlık davranışıdır; sağlığınızı korumak için sigaraya başlamamanız ve pasif içicilikten de uzak durmanız önerilir. ✅");
        }

        // SU
        if (su < 2000) {
            ekle("Su Tüketimi", "Yeterli hücresel fonksiyon için günlük en az 2–2.5 litre su tüketilmelidir. 💧");
        } else {
            ekle("Su Tüketimi", "Tüketiminiz yeterli görünüyor; sağlığınız için su tüketiminizi bu düzeyde korumaya özen gösterin. 💦");
        }

        // BAĞIRSAK
        if (bagirsak === "Kabız") {
            ekle("Sindirim Sistemi", "Lifli gıdalar, bol su tüketimi ve hareket kabızlığı azaltır. 🥦");
        } else if (bagirsak === "İshal") {
            ekle("Sindirim Sistemi", "Sıvı ve elektrolit desteği sağlayarak yağlı gıdalardan kaçınınız. 🥤");
        } else if (bagirsak === "Düzensiz") {
            ekle("Sindirim Sistemi", "Düzenli öğün saatleri, probiyotikler ve lif tüketimi önerilir. 🍎");
        } else {
            ekle("Sindirim Sistemi", "Bağırsak düzeniniz optimal görünmektedir — sağlıklı beslenmeye devam edin. ✅");
        }

        // GENEL RİSK
        if (risk_flag === 1) {
            ekle("Genel Değerlendirme", "Sağlık risk puanınız yükselmiş durumda. Lütfen yaşam tarzı değişikliklerine öncelik verin. ⚠️");
        } else {
            ekle("Genel Değerlendirme", "Genel sağlık riskiniz düşüktür — koruyucu sağlık alışkanlıklarını sürdürün. 🌟");
        }

        return mesajlar.join("");
    }

    // ----------------------
    // Ana Hesaplama Fonksiyonu
    // ----------------------
    function calculateRisk() {
        // Form Elemanlarını Al
        const genderEl = document.getElementById('gender');
        const ageEl = document.getElementById('age');
        const boyEl = document.getElementById('boy');
        const kiloEl = document.getElementById('kilo');
        const stressEl = document.getElementById('stress');
        const activityEl = document.getElementById('activity');
        const sleepEl = document.getElementById('sleep');
        const sigaraEl = document.querySelector('input[name="sigara"]:checked');
        const suEl = document.getElementById('su');
        const bagirsakEl = document.getElementById('bagirsak');
        const systolicEl = document.getElementById('systolic');
        const diastolicEl = document.getElementById('diastolic');

        // Validasyon: Basit bir kontrol (Eğer temel alanlar boşsa uyarı ver)
        if (!genderEl.value || !ageEl.value || !boyEl.value || !kiloEl.value || !activityEl.value || !sleepEl.value || !sigaraEl || !suEl.value || !bagirsakEl.value || !systolicEl.value || !diastolicEl.value) {
            alert("Lütfen tüm alanları doldurunuz ve seçimlerinizi yapınız.");
            return;
        }

        // Değerleri Parse Et
        const gender = genderEl.value;
        const age = parseFloat(ageEl.value);
        const boy = parseFloat(boyEl.value);
        const kilo = parseFloat(kiloEl.value);
        const stress = parseInt(stressEl.value);
        const activity = parseFloat(activityEl.value);
        const sleep = parseFloat(sleepEl.value);
        const sigaraVal = sigaraEl.value;
        const su = parseFloat(suEl.value);
        const bagirsak = bagirsakEl.value;
        const systolic = parseFloat(systolicEl.value);
        const diastolic = parseFloat(diastolicEl.value);

        // Hesaplamalar
        const bmi = kilo / (boy ** 2);
        const [bmi_cat, bmi_emoji, bmi_color] = bmi_category(bmi);
        const [bp_cat, bp_emoji, bp_color] = bp_category(systolic, diastolic);

        const sigara_score = (sigaraVal === "Evet") ? 1 : 0;

        const score = risk_score_calculator(bmi_cat, bp_cat, stress, activity, sleep, sigara_score, su, bagirsak);
        const [risk_lbl, risk_emoji, risk_color, risk_flag] = risk_label(score);

        // Farkındalık HTML'ini oluştur
        const farkindalik = farkindalik_mesaji(bmi_cat, bp_cat, stress, activity, sleep, sigara_score, su, bagirsak, risk_flag);

        // Tablo Verilerini Hazırla
        const rows = [
            { cat: "BMI", val: bmi_cat, emo: bmi_emoji, color: bmi_color },
            { cat: "Kan Basıncı", val: bp_cat, emo: bp_emoji, color: bp_color },
            { cat: "Stres Seviyesi", val: stress, emo: (stress < 7 ? "✅" : "⚠️"), color: "" },
            { cat: "Fiziksel Aktivite", val: activity, emo: (activity >= 30 ? "🏃‍♂️" : "🛋️"), color: "" },
            { cat: "Uyku Süresi", val: sleep, emo: (sleep >= 7 ? "✔️" : "😴"), color: "" },
            { cat: "Sigara", val: sigaraVal, emo: (sigaraVal === "Hayır" ? "✔️" : "⚠️"), color: "" },
            { cat: "Su Tüketimi", val: su, emo: (su >= 2000 ? "💧" : "⚠️"), color: "" },
            { cat: "Bağırsak Alışkanlığı", val: bagirsak, emo: (bagirsak === "Düzenli" ? "✔️" : "⚠️"), color: "" },
            { cat: "Risk Puanı", val: score, emo: risk_emoji, color: risk_color }
        ];

        // Tabloyu Güncelle
        const tbody = document.querySelector("#resultTable tbody");
        tbody.innerHTML = ""; // Temizle

        rows.forEach(row => {
            const tr = document.createElement("tr");
            
            // Kategori
            const tdCat = document.createElement("td");
            tdCat.innerText = row.cat;
            tr.appendChild(tdCat);

            // Durum
            const tdVal = document.createElement("td");
            tdVal.innerText = row.val;
            if (row.color) {
                tdVal.style.backgroundColor = row.color;
                tdVal.style.color = "#000";
                tdVal.style.fontWeight = "500";
            }
            tr.appendChild(tdVal);

            // Emoji
            const tdEmo = document.createElement("td");
            tdEmo.innerText = row.emo;
            tr.appendChild(tdEmo);

            tbody.appendChild(tr);
        });

        // Farkındalık Metnini Güncelle
        document.getElementById("farkindalik_text").innerHTML = farkindalik;
    }

    // ----------------------
    // Form Temizleme Fonksiyonu
    // ----------------------
    function clearForm() {
        // Form elementini al ve resetle (Inputlar ve Selectler temizlenir)
        document.getElementById("healthForm").reset();

        // Slider değerini görsel olarak güncelle (Varsayılan 5'e dönecek)
        document.getElementById("stress-val").innerText = "5";

        // Tabloyu Temizle
        document.querySelector("#resultTable tbody").innerHTML = "";

        // Farkındalık Alanını Sıfırla
        document.getElementById("farkindalik_text").innerText = "Sonuçları görmek için bilgilerinizi girip 'Hesapla' butonuna basınız.";
    }
</script>

</body>
</html>
